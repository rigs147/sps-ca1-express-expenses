# Name of this GitHub Actions workflow.
name: Semgrep CE scan

on:
  # Scan in PRs:
  pull_request: {}
  # Scan on-demand through GitHub Actions interface:
  workflow_dispatch: {}
  # Scan mainline branches and report all findings:
  push:
    branches: ["feature/CA2-SAST-Pipeline"]
  # Schedule the CI job (this method uses cron syntax):
  schedule:
    - cron: '20 17 * * *' # Sets Semgrep to scan every day at 17:20 UTC.
    # It is recommended to change the schedule to a random time.

permissions:
  contents: read

jobs:
  semgrep:
    # User definable name of this GitHub Actions job.
    name: semgrep-oss/scan
    # If you are self-hosting, change the following `runs-on` value: 
    runs-on: ubuntu-latest

    container:
      # A Docker image with Semgrep installed. Do not change this.
      image: semgrep/semgrep

    # Skip any PR created by dependabot to avoid permission issues:
    if: (github.actor != 'dependabot[bot]')

    steps:
      # Fetch project source with GitHub Actions Checkout.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Run the "semgrep scan" command on the command line of the docker image.
      - run: semgrep scan --config auto
  dependency-audit:
    
    name: dependency-audit
    
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run dependency audit
        run: npm audit --audit-level=high 
  secret-scan:
    
    name: secret-scan
    
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository with Git history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ownership-tests:
    
    name: Claim and receipt ownership tests
    
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.13.0'

      - name: Install dependencies
        run: npm ci

      - name: Run ownership tests
        run: node --test tests/security/claim-ownership.test.js
  sql-injection-gate:
    
    name: SQL injection gate
    
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install the tested Semgrep release
        run: |
          python3 -m venv "$RUNNER_TEMP/sql-gate"
          "$RUNNER_TEMP/sql-gate/bin/python" -m pip install --disable-pip-version-check semgrep==1.187.0
      
      - name: Verify the pinned SQL rule and scan the checked-out source
        shell: bash
        env:
          RULE_REV: a5ad1714f00c9f7fde980cab0ea1d6dc6d414fd2
          RULE_SHA256: 22dab9b0182dd25bb5aaf3ae796973dc53ea91ccb0e747055fd15ee1ef9a8592
        run: |
          set -euo pipefail
          rule="$RUNNER_TEMP/tainted-sql-string.yaml"
          curl --fail --silent --show-error --location --retry 2 \
            "https://raw.githubusercontent.com/semgrep/semgrep-rules/${RULE_REV}/javascript/express/security/injection/tainted-sql-string.yaml" \
            --output "$rule"
          printf '%s  %s\n' "$RULE_SHA256" "$rule" | sha256sum --check
          "$RUNNER_TEMP/sql-gate/bin/semgrep" scan --config "$rule" --metrics=off --disable-version-check --error .



